<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurityScan-Agent — AI Security Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>🛡️ SecurityScan-Agent</h1>
    <div class="header-right">
      <button class="btn btn-scan" id="btnScan">▶ Start Scan</button>
      <button class="btn btn-export">📥 Export</button>
    </div>
  </header>

  <main class="main-grid">
    <aside class="sidebar">
      <h3>Scan Target</h3>
      <div class="scan-target">
        <div class="target-label">Target</div>
        <div class="target-value">192.168.1.0/24</div>
      </div>
      <div class="scan-target">
        <div class="target-label">Domain</div>
        <div class="target-value">*.example.com</div>
      </div>
      <div class="scan-target">
        <div class="target-label">Scan Type</div>
        <div class="target-value">Full Comprehensive</div>
      </div>

      <h3 style="margin-top: 20px;">Severity Breakdown</h3>
      <div class="severity-summary">
        <div class="severity-row critical">
          <div class="severity-label"><span class="severity-dot critical"></span> Critical</div>
          <span class="severity-count" id="count-critical">0</span>
        </div>
        <div class="severity-row high">
          <div class="severity-label"><span class="severity-dot high"></span> High</div>
          <span class="severity-count" id="count-high">0</span>
        </div>
        <div class="severity-row medium">
          <div class="severity-label"><span class="severity-dot medium"></span> Medium</div>
          <span class="severity-count" id="count-medium">0</span>
        </div>
        <div class="severity-row low">
          <div class="severity-label"><span class="severity-dot low"></span> Low</div>
          <span class="severity-count" id="count-low">0</span>
        </div>
      </div>

      <h3 style="margin-top: 20px;">Total Findings</h3>
      <div style="font-size: 2rem; font-weight: 700; color: var(--accent-neon); text-align: center; padding: 8px;" id="totalFindings">0</div>
    </aside>

    <section class="main-content">
      <div class="scan-progress-section">
        <div class="scan-header">
          <div class="scan-title">🔍 Scan Progress</div>
          <div class="scan-pct" id="progressPct">0%</div>
        </div>
        <div class="scan-bar-container">
          <div class="scan-bar" id="progressBar"></div>
        </div>
        <div class="scan-phase" id="scanPhase">Idle — waiting to start</div>
      </div>

      <div class="findings-header">
        <span>Vulnerability Findings</span>
        <span class="finding-count"><span id="totalFindingsH">0</span> issues</span>
      </div>
      <div id="findingsList"></div>
    </section>

    <aside class="right-panel">
      <div class="panel-block">
        <h3>Open Ports</h3>
        <div class="port-list" id="portList"></div>
      </div>
      <div class="panel-block" style="flex:1; display:flex; flex-direction:column;">
        <h3>Scan Log</h3>
        <div class="scan-log" id="scanLog"></div>
      </div>
    </aside>
  </main>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box" id="detailBox"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
