<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurityScan Agent — URL Security Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <span class="logo-icon">🛡️</span>
            <h1>SecurityScan Agent</h1>
        </div>
        <nav class="nav-tabs">
            <button class="tab active" data-tab="scan">Scan</button>
            <button class="tab" data-tab="history">History</button>
        </nav>
    </header>

    <main class="container">
        <!-- SCAN TAB -->
        <section id="tab-scan" class="tab-content active">
            <div class="scanner-panel">
                <h2>URL Security Scanner</h2>
                <p class="subtitle">Enter a URL to perform a comprehensive security analysis.</p>
                <div class="input-row">
                    <input type="url" id="urlInput" placeholder="https://example.com" autocomplete="off" spellcheck="false" />
                    <button id="scanBtn" class="btn-primary">Scan</button>
                </div>
                <div id="scanError" class="error-msg hidden"></div>
            </div>

            <!-- Progress Bar -->
            <div id="progressSection" class="hidden">
                <div class="progress-header">
                    <span id="progressLabel">Initializing scan...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="progressBar" class="progress-bar-fill" style="width:0%"></div>
                </div>
                <div id="progressLog" class="progress-log"></div>
            </div>

            <!-- Results -->
            <div id="resultsSection" class="hidden">
                <div class="results-header">
                    <h2>Scan Results</h2>
                    <div class="results-actions">
                        <span id="scoreBadge" class="score-badge">—</span>
                        <button id="exportBtn" class="btn-secondary">Export Report</button>
                    </div>
                </div>

                <div id="summaryCards" class="summary-cards"></div>

                <!-- Tabs for result categories -->
                <div class="result-tabs">
                    <button class="rtab active" data-rtab="headers">HTTP Headers</button>
                    <button class="rtab" data-rtab="ssl">SSL Certificate</button>
                    <button class="rtab" data-rtab="ports">Open Ports</button>
                    <button class="rtab" data-rtab="xss">XSS Patterns</button>
                    <button class="rtab" data-rtab="traversal">Dir Traversal</button>
                </div>

                <div id="rpanel-headers" class="rpanel active"></div>
                <div id="rpanel-ssl" class="rpanel"></div>
                <div id="rpanel-ports" class="rpanel"></div>
                <div id="rpanel-xss" class="rpanel"></div>
                <div id="rpanel-traversal" class="rpanel"></div>
            </div>
        </section>

        <!-- HISTORY TAB -->
        <section id="tab-history" class="tab-content">
            <div class="history-header">
                <h2>Scan History</h2>
                <button id="clearHistoryBtn" class="btn-danger">Clear History</button>
            </div>
            <div id="historyList" class="history-list"></div>
            <div id="historyEmpty" class="empty-state">No scan history yet. Run your first scan!</div>

            <!-- Re-show results from history -->
            <div id="historyDetail" class="hidden">
                <button id="backToHistoryBtn" class="btn-secondary">← Back to History</button>
                <div id="historyResults"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>SecurityScan Agent v2.0 — Browser-based URL security analysis tool</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
